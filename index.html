
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BI Outreach | Bajwa Industries</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 25px;
      background: #f4f4f4;
      color: #222;
      font-family: Arial, sans-serif;
    }
    .container {
      max-width: 850px;
      margin: auto;
      background: white;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 3px 18px #0001;
    }
    h1 { margin: 0; color: #171717; }
    .subtitle { color: #777; margin-bottom: 25px; }
    label {
      display: block;
      font-weight: bold;
      margin: 18px 0 8px;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font: inherit;
    }
    textarea { min-height: 130px; resize: vertical; }
    button {
      margin-top: 20px;
      padding: 12px 20px;
      border: 0;
      border-radius: 7px;
      background: #171717;
      color: white;
      cursor: pointer;
    }
    .note { color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <main class="container">
    <h1>BI OUTREACH</h1>
    <p class="subtitle">Bajwa Industries · Google Workspace</p>

    <label>1. Buyer List (CSV)</label>
    <input type="file" id="csvFile" accept=".csv">
    <p class="note" id="csvStatus">No CSV selected.</p>

    <label>2. Email Subject</label>
    <input id="subject" placeholder="Premium Quality Fabric – Factory Prices">

    <label>3. Email Message</label>
    <textarea id="message" placeholder="Write your business outreach message..."></textarea>

    <label>4. Product Photos (2–3)</label>
    <input type="file" id="photos" accept="image/*" multiple>

    <label>5. Sending Delay (seconds)</label>
    <input type="number" id="delay" value="60" min="30">

    <label>6. Batch Limit</label>
    <input type="number" id="batch" value="10" min="1" max="50">

    <p class="note">
      Emails will be reviewed and sent only to verified business
      recipients who have given permission to be contacted.
    </p>

    <button id="preview">Preview Setup</button>
    <p id="status"></p>
  </main>

  <script>
    const csv = document.getElementById("csvFile");
    csv.addEventListener("change", () => {
      document.getElementById("csvStatus").textContent =
        csv.files.length
          ? "Selected: " + csv.files[0].name
          : "No CSV selected.";
    });

    document.getElementById("preview").addEventListener("click", () => {
      document.getElementById("status").textContent =
        "Setup saved in this page. Sending will be enabled after backend connection.";
    });
  </script>
</body>
</html>
